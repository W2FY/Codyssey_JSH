<!--Gemini 3.1 Pro 수정-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 전체 페이지 스타일 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 10px; }

        /* 상단 버튼 및 입력 영역 */
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #45a049; }

        /* 🌟 추가됨: 영화 제목 입력창 스타일 */
        #movie-title-input {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #555;
            border-radius: 5px;
            background-color: #333;
            color: white;
            width: 200px;
        }
        #movie-title-input::placeholder { color: #aaa; }

        /* 티어리스트 표 영역 */
        #tier-board {
            width: 100%;
            max-width: 900px;
            background-color: #2b2b2b;
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
        }

        /* 각 티어 한 줄 */
        .tier-row {
            display: flex;
            border-bottom: 2px solid #000;
            min-height: 120px;
            transition: border 0.2s;
        }
        .tier-row:last-child { border-bottom: none; }

        /* 티어 순서 변경 손잡이 */
        .row-drag-handle {
            width: 30px;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            font-size: 18px;
            color: #888;
            border-right: 1px solid #000;
        }
        .row-drag-handle:active { cursor: grabbing; }

        /* 티어 이름 (S, A, B 등) */
        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            border-right: 2px solid #000;
            position: relative;
        }
        .tier-label[contenteditable="true"] {
            outline: none;
            cursor: text;
        }

        /* 티어 삭제 버튼 */
        .delete-tier-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 10px;
            padding: 2px 5px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            border: none;
            cursor: pointer;
            display: none;
        }
        .tier-label:hover .delete-tier-btn { display: block; }

        /* 영화가 놓일 공간 (드롭존) */
        .tier-dropzone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            background-color: #333;
        }

        /* 하단 대기열 및 휴지통 영역 */
        #bottom-area {
            width: 100%;
            max-width: 900px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #movie-pool {
            min-height: 150px;
            background-color: #2b2b2b;
            border: 2px dashed #888;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #trash-zone {
            min-height: 80px;
            background-color: #4a1c1c;
            border: 2px dashed #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff8888;
            font-weight: bold;
            font-size: 18px;
        }

        /* 🌟 수정됨: 텍스트 기반 영화 아이템 */
        .movie-item {
            width: 90px;
            height: 90px; /* 텍스트에 맞게 정사각형 비율로 조정 */
            background-color: #555;
            color: white;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            padding: 5px;
            box-sizing: border-box;
            border: 2px solid #222;
            border-radius: 8px; /* 모서리를 둥글게 */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            word-break: keep-all; /* 단어 단위로 줄바꿈 */
        }
        .movie-item:active { cursor: grabbing; }
    </style>
</head>
<body>

    <h1>🎬 나만의 영화 티어리스트</h1>
    
    <div class="controls">
        <button onclick="addTierRow()">➕ 등급(티어) 추가</button>
        
        <!-- 🌟 수정됨: 파일 첨부 대신 텍스트 입력창과 버튼으로 변경 -->
        <input type="text" id="movie-title-input" placeholder="영화 제목을 입력하세요" onkeypress="handleEnter(event)">
        <button onclick="addMovie()">➕ 영화 추가</button>
        
        <button onclick="saveAsImage()" style="background-color: #2196F3; margin-left: auto;">📸 이미지로 저장</button>
    </div>

    <div id="tier-board">
        <div class="tier-row">
            <div class="row-drag-handle" draggable="true" title="드래그하여 순서 변경">↕</div>
            <div class="tier-label" style="background-color: #ff7f7f;" contenteditable="true">S
                <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
            </div>
            <div class="tier-dropzone drop-area"></div>
        </div>
        <div class="tier-row">
            <div class="row-drag-handle" draggable="true" title="드래그하여 순서 변경">↕</div>
            <div class="tier-label" style="background-color: #ffbf7f;" contenteditable="true">A
                <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
            </div>
            <div class="tier-dropzone drop-area"></div>
        </div>
        <div class="tier-row">
            <div class="row-drag-handle" draggable="true" title="드래그하여 순서 변경">↕</div>
            <div class="tier-label" style="background-color: #ffff7f;" contenteditable="true">B
                <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
            </div>
            <div class="tier-dropzone drop-area"></div>
        </div>
    </div>

    <div id="bottom-area">
        <h3>👇 대기열 (영화를 끌어서 위로 올리세요)</h3>
        <div id="movie-pool" class="drop-area">
            <!-- 기본 제공 영화 블록 -->
            <div class="movie-item" draggable="true" style="background-color: #e74c3c;">인셉션</div>
            <div class="movie-item" draggable="true" style="background-color: #3498db;">인터스텔라</div>
            <div class="movie-item" draggable="true" style="background-color: #9b59b6;">어벤져스</div>
        </div>
        <div id="trash-zone" class="drop-area">
            🗑️ 영화를 삭제하려면 이곳으로 드래그하세요
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 영화 아이템 드래그 앤 드롭
        // ==========================================
        let draggedItem = null;

        function addDragEvents(item) {
            item.addEventListener('dragstart', function(e) {
                draggedItem = item;
                setTimeout(() => item.style.opacity = '0.5', 0);
            });
            item.addEventListener('dragend', function(e) {
                setTimeout(() => {
                    draggedItem.style.opacity = '1';
                    draggedItem = null;
                }, 0);
            });
        }

        function setupDropZones() {
            const dropZones = document.querySelectorAll('.drop-area');
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', e => e.preventDefault());
                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (draggedItem) {
                        if (this.id === 'trash-zone') draggedItem.remove();
                        else this.appendChild(draggedItem);
                    }
                });
            });
        }

        document.querySelectorAll('.movie-item').forEach(addDragEvents);
        setupDropZones();

        // ==========================================
        // 2. 티어(줄) 순서 변경 드래그 앤 드롭
        // ==========================================
        let draggedRow = null;

        function addRowDragEvents(row) {
            const handle = row.querySelector('.row-drag-handle');
            
            handle.addEventListener('dragstart', function(e) {
                draggedRow = row;
                e.dataTransfer.setDragImage(row, 15, 15);
                setTimeout(() => row.style.opacity = '0.4', 0);
            });

            handle.addEventListener('dragend', function(e) {
                draggedRow.style.opacity = '1';
                draggedRow = null;
                document.querySelectorAll('.tier-row').forEach(r => {
                    r.style.borderTop = '';
                    r.style.borderBottom = '';
                });
            });

            row.addEventListener('dragover', function(e) {
                if (!draggedRow || draggedRow === row) return;
                e.preventDefault();
                
                const bounding = row.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                
                if (e.clientY - offset > 0) {
                    row.style.borderBottom = '4px solid #4CAF50';
                    row.style.borderTop = '';
                } else {
                    row.style.borderTop = '4px solid #4CAF50';
                    row.style.borderBottom = '';
                }
            });

            row.addEventListener('dragleave', function(e) {
                if (!draggedRow) return;
                row.style.borderTop = '';
                row.style.borderBottom = '';
            });

            row.addEventListener('drop', function(e) {
                if (!draggedRow || draggedRow === row) return;
                e.preventDefault();
                
                row.style.borderTop = '';
                row.style.borderBottom = '';
                
                const bounding = row.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                
                if (e.clientY - offset > 0) {
                    row.parentNode.insertBefore(draggedRow, row.nextSibling);
                } else {
                    row.parentNode.insertBefore(draggedRow, row);
                }
            });
        }

        document.querySelectorAll('.tier-row').forEach(addRowDragEvents);

        // ==========================================
        // 3. 🌟 커스텀 기능: 텍스트로 영화 추가
        // ==========================================
        
        // 엔터키를 누르면 영화가 추가되도록 하는 함수
        function handleEnter(event) {
            if (event.key === 'Enter') {
                addMovie();
            }
        }

        function addMovie() {
            const input = document.getElementById('movie-title-input');
            const title = input.value.trim(); // 양쪽 공백 제거

            // 입력값이 없으면 경고창 띄우기
            if (title === "") {
                alert("영화 제목을 입력해주세요!");
                return;
            }

            // 새로운 텍스트 블록(div) 생성
            const newMovie = document.createElement('div');
            newMovie.classList.add('movie-item');
            newMovie.setAttribute('draggable', 'true');
            newMovie.textContent = title;
            
            // 블록들이 너무 밋밋하지 않게 랜덤한 배경색 부여
            const blockColors = ['#e74c3c', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#34495e'];
            const randomColor = blockColors[Math.floor(Math.random() * blockColors.length)];
            newMovie.style.backgroundColor = randomColor;
            
            // 드래그 이벤트 부여 후 대기열에 추가
            addDragEvents(newMovie);
            document.getElementById('movie-pool').appendChild(newMovie);
            
            // 추가 후 입력창 비우기
            input.value = '';
            input.focus(); // 연속해서 입력하기 편하게 커서 유지
        }

        // ==========================================
        // 4. 티어 추가/삭제 및 결과 저장
        // ==========================================
        const colors = ['#7fff7f', '#7fffff', '#7f7fff', '#ff7fff', '#d3d3d3'];
        let colorIndex = 0;

        function addTierRow() {
            const board = document.getElementById('tier-board');
            const newRow = document.createElement('div');
            newRow.classList.add('tier-row');
            
            const bgColor = colors[colorIndex % colors.length];
            colorIndex++;

            newRow.innerHTML = `
                <div class="row-drag-handle" draggable="true" title="드래그하여 순서 변경">↕</div>
                <div class="tier-label" style="background-color: ${bgColor};" contenteditable="true">New
                    <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
                </div>
                <div class="tier-dropzone drop-area"></div>
            `;
            
            board.appendChild(newRow);
            setupDropZones();
            addRowDragEvents(newRow);
        }

        function deleteTier(button) {
            const row = button.parentElement.parentElement;
            const movies = row.querySelectorAll('.movie-item');
            const pool = document.getElementById('movie-pool');
            movies.forEach(movie => pool.appendChild(movie));
            row.remove();
        }

        function saveAsImage() {
            const board = document.getElementById('tier-board');
            const handles = document.querySelectorAll('.row-drag-handle');
            handles.forEach(h => h.style.display = 'none');

            html2canvas(board, { backgroundColor: "#2b2b2b" }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-tierlist.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                handles.forEach(h => h.style.display = 'flex');
            });
        }
    </script>
</body>
</html>
