<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트</title>
    <!-- 이미지를 저장하기 위한 외부 라이브러리 불러오기 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 전체 페이지 스타일 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 10px; }

        /* 상단 버튼 영역 */
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #45a049; }
        .btn-danger { background-color: #f44336; }
        .btn-danger:hover { background-color: #da190b; }

        /* 티어리스트 표 영역 */
        #tier-board {
            width: 100%;
            max-width: 900px;
            background-color: #2b2b2b;
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
        }

        /* 각 티어 한 줄 */
        .tier-row {
            display: flex;
            border-bottom: 2px solid #000;
            min-height: 120px;
        }
        .tier-row:last-child { border-bottom: none; }

        /* 티어 이름 (S, A, B 등) */
        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            border-right: 2px solid #000;
            position: relative;
        }
        /* 티어 이름 수정 가능하도록 표시 */
        .tier-label[contenteditable="true"] {
            outline: none;
            cursor: text;
        }

        /* 티어 삭제 버튼 */
        .delete-tier-btn {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 10px;
            padding: 2px 5px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            border: none;
            cursor: pointer;
            display: none;
        }
        .tier-label:hover .delete-tier-btn { display: block; }

        /* 영화가 놓일 공간 (드롭존) */
        .tier-dropzone {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            background-color: #333;
        }

        /* 하단 대기열 및 휴지통 영역 */
        #bottom-area {
            width: 100%;
            max-width: 900px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 대기열 (기본 영화들이 있는 곳) */
        #movie-pool {
            min-height: 150px;
            background-color: #2b2b2b;
            border: 2px dashed #888;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 휴지통 */
        #trash-zone {
            min-height: 80px;
            background-color: #4a1c1c;
            border: 2px dashed #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff8888;
            font-weight: bold;
            font-size: 18px;
        }

        /* 영화 아이템 (드래그 가능) */
        .movie-item {
            width: 80px;
            height: 115px;
            background-color: #555;
            background-size: cover;
            background-position: center;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 12px;
            border: 1px solid #222;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .movie-item:active { cursor: grabbing; }

        /* 영화 추가 파일 입력창 숨기기 */
        #file-input { display: none; }
    </style>
</head>
<body>

    <h1>🎬 나만의 영화 티어리스트</h1>
    
    <div class="controls">
        <button onclick="addTierRow()">➕ 등급(티어) 추가</button>
        <button onclick="document.getElementById('file-input').click()">📁 내 PC에서 영화 추가</button>
        <input type="file" id="file-input" accept="image/*" onchange="addMovieFromFile(event)">
        <button onclick="saveAsImage()" style="background-color: #2196F3;">📸 이미지로 저장</button>
    </div>

    <!-- 캡처될 티어리스트 영역 -->
    <div id="tier-board">
        <!-- 기본 제공 티어 -->
        <div class="tier-row">
            <div class="tier-label" style="background-color: #ff7f7f;" contenteditable="true">S
                <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
            </div>
            <div class="tier-dropzone drop-area"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label" style="background-color: #ffbf7f;" contenteditable="true">A
                <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
            </div>
            <div class="tier-dropzone drop-area"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label" style="background-color: #ffff7f;" contenteditable="true">B
                <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
            </div>
            <div class="tier-dropzone drop-area"></div>
        </div>
    </div>

    <div id="bottom-area">
        <h3>👇 대기열 (영화를 끌어서 위로 올리세요)</h3>
        <div id="movie-pool" class="drop-area">
            <!-- 기본 제공 영화 (텍스트로 대체) -->
            <div class="movie-item" draggable="true" style="background-color: #3498db;">기본 영화 1</div>
            <div class="movie-item" draggable="true" style="background-color: #9b59b6;">기본 영화 2</div>
            <div class="movie-item" draggable="true" style="background-color: #e67e22;">기본 영화 3</div>
        </div>

        <div id="trash-zone" class="drop-area">
            🗑️ 영화를 삭제하려면 이곳으로 드래그하세요
        </div>
    </div>

    <script>
        // --- 드래그 앤 드롭 로직 ---
        let draggedItem = null;

        // 영화 아이템에 드래그 이벤트 부여하는 함수
        function addDragEvents(item) {
            item.addEventListener('dragstart', function(e) {
                draggedItem = item;
                setTimeout(() => item.style.opacity = '0.5', 0);
            });

            item.addEventListener('dragend', function(e) {
                setTimeout(() => {
                    draggedItem.style.opacity = '1';
                    draggedItem = null;
                }, 0);
            });
        }

        // 드롭존(티어칸, 대기열, 휴지통)에 이벤트 부여하는 함수
        function setupDropZones() {
            const dropZones = document.querySelectorAll('.drop-area');
            
            dropZones.forEach(zone => {
                // 드래그 중인 요소가 위로 지나갈 때
                zone.addEventListener('dragover', function(e) {
                    e.preventDefault(); // 기본 동작을 막아야 드롭이 가능함
                });

                // 드래그 중인 요소를 놓았을 때
                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    if (draggedItem) {
                        // 만약 휴지통에 놓았다면 삭제
                        if (this.id === 'trash-zone') {
                            draggedItem.remove();
                        } else {
                            // 그 외의 공간(티어칸, 대기열)이면 해당 공간으로 이동
                            this.appendChild(draggedItem);
                        }
                    }
                });
            });
        }

        // 초기 설정: 기존 영화와 드롭존에 이벤트 연결
        document.querySelectorAll('.movie-item').forEach(addDragEvents);
        setupDropZones();


        // --- 커스텀 기능: 영화 추가 ---
        function addMovieFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // 새로운 영화 요소 만들기
                const newMovie = document.createElement('div');
                newMovie.classList.add('movie-item');
                newMovie.setAttribute('draggable', 'true');
                newMovie.style.backgroundImage = `url(${e.target.result})`;
                
                // 이벤트 부여 후 대기열에 추가
                addDragEvents(newMovie);
                document.getElementById('movie-pool').appendChild(newMovie);
            };
            reader.readAsDataURL(file);
            
            // 같은 파일을 다시 올릴 수 있도록 input 초기화
            event.target.value = '';
        }


        // --- 커스텀 기능: 티어(등급) 추가 및 삭제 ---
        const colors = ['#7fff7f', '#7fffff', '#7f7fff', '#ff7fff', '#d3d3d3'];
        let colorIndex = 0;

        function addTierRow() {
            const board = document.getElementById('tier-board');
            const newRow = document.createElement('div');
            newRow.classList.add('tier-row');
            
            const bgColor = colors[colorIndex % colors.length];
            colorIndex++;

            newRow.innerHTML = `
                <div class="tier-label" style="background-color: ${bgColor};" contenteditable="true">New
                    <button class="delete-tier-btn" onclick="deleteTier(this)" contenteditable="false">X</button>
                </div>
                <div class="tier-dropzone drop-area"></div>
            `;
            
            board.appendChild(newRow);
            setupDropZones(); // 새로 생긴 드롭존에 이벤트 다시 연결
        }

        function deleteTier(button) {
            // 버튼의 부모(라벨)의 부모(행)를 찾아서 삭제
            const row = button.parentElement.parentElement;
            
            // 삭제하기 전에 그 안에 있던 영화들을 대기열로 돌려보냄
            const movies = row.querySelectorAll('.movie-item');
            const pool = document.getElementById('movie-pool');
            movies.forEach(movie => pool.appendChild(movie));

            row.remove();
        }


        // --- 결과 저장 기능 ---
        function saveAsImage() {
            const board = document.getElementById('tier-board');
            
            // html2canvas를 이용해 특정 영역을 캔버스로 변환
            html2canvas(board, {
                backgroundColor: "#2b2b2b" // 배경색 지정
            }).then(canvas => {
                // 캔버스를 이미지 파일로 변환하여 다운로드
                const link = document.createElement('a');
                link.download = 'my-tierlist.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
