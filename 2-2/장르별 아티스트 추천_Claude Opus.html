<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장르별 아티스트 추천</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #121212; color: #eee; padding: 20px; line-height: 1.5;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 24px; color: #1db954; }

  /* 검색창 */
  #searchBox {
    width: 100%; padding: 14px 18px; font-size: 16px;
    border: none; border-radius: 30px;
    background: #282828; color: #fff; margin-bottom: 10px;
  }
  #searchBox::placeholder { color: #888; }

  /* 퀴즈 이동 링크 */
  .quiz-link {
    display: inline-block; background: none; border: none;
    color: #1db954; cursor: pointer; font-size: 14px;
    text-decoration: underline; margin-bottom: 20px;
  }

  /* 장르 버튼 */
  .genre-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .genre-btn {
    padding: 10px 18px; border: none; border-radius: 20px;
    background: #333; color: #eee; cursor: pointer; font-size: 14px;
    transition: background .2s;
  }
  .genre-btn:hover { background: #444; }
  .genre-btn.active { background: #1db954; color: #000; font-weight: bold; }

  /* 아티스트 리스트 */
  .artist-card {
    background: #1e1e1e; border-radius: 10px;
    margin-bottom: 10px; overflow: hidden;
  }
  .artist-header {
    padding: 14px 18px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .artist-header:hover { background: #262626; }
  .artist-name { font-weight: bold; }
  .artist-genre-tag { font-size: 12px; color: #1db954; }
  .songs { display: none; padding: 0 18px 14px; }
  .songs.open { display: block; }
  .song-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 1px solid #333;
  }
  .yt-btn {
    background: #ff0000; color: #fff; border: none;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .yt-btn:hover { background: #cc0000; }

  .empty { text-align: center; color: #888; padding: 30px; }

  /* 퀴즈 섹션 */
  #quizSection {
    background: #1e1e1e; border-radius: 12px;
    padding: 24px; margin-top: 40px;
  }
  #quizSection h2 { color: #1db954; margin-bottom: 16px; }
  .quiz-q { margin-bottom: 20px; }
  .quiz-q > p { margin-bottom: 10px; font-weight: bold; }
  .quiz-opt {
    display: block; width: 100%; text-align: left;
    padding: 10px 14px; margin-bottom: 6px;
    background: #2a2a2a; border: 2px solid transparent; border-radius: 8px;
    color: #eee; cursor: pointer;
  }
  .quiz-opt.selected { border-color: #1db954; background: #0f3d22; }
  .quiz-submit {
    width: 100%; padding: 12px; background: #1db954; color: #000;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 10px;
  }
  #quizResult {
    margin-top: 20px; padding: 16px; border-radius: 8px;
    background: #0f3d22; display: none; text-align: center;
  }
  #quizResult strong { color: #1db954; font-size: 22px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 장르별 아티스트 추천</h1>

  <!-- 상단 검색창 -->
  <input type="text" id="searchBox" placeholder="가수 이름 또는 장르명을 입력하세요...">
  <br>
  <!-- 퀴즈 섹션 이동 링크 -->
  <button class="quiz-link" onclick="document.getElementById('quizSection').scrollIntoView({behavior:'smooth'})">
    장르 이름을 잘 모르시나요?
  </button>

  <!-- 장르 버튼 목록 -->
  <div class="genre-buttons" id="genreButtons"></div>

  <!-- 아티스트 리스트 -->
  <div id="artistList"></div>

  <!-- 장르 추천 퀴즈 섹션 -->
  <div id="quizSection">
    <h2>🎯 장르 추천 퀴즈</h2>
    <div id="quizQuestions"></div>
    <button class="quiz-submit" onclick="showQuizResult()">결과 보기</button>
    <div id="quizResult"></div>
  </div>
</div>

<script>
/* ===== 1. 데이터: 장르별 아티스트 & 대표곡(고정 데이터) ===== */
const musicData = {
  "K-Pop": [
    { name: "BTS",      songs: ["Dynamite", "Butter", "Spring Day"] },
    { name: "NewJeans", songs: ["Ditto", "Hype Boy", "Super Shy"] },
    { name: "IU",       songs: ["Blueming", "Celebrity", "Love poem"] }
  ],
  "Rock": [
    { name: "Queen",    songs: ["Bohemian Rhapsody", "Don't Stop Me Now", "We Will Rock You"] },
    { name: "Coldplay", songs: ["Yellow", "Viva la Vida", "Fix You"] },
    { name: "Nirvana",  songs: ["Smells Like Teen Spirit", "Come As You Are", "Lithium"] }
  ],
  "Jazz": [
    { name: "Louis Armstrong", songs: ["What a Wonderful World", "La Vie En Rose", "Hello Dolly"] },
    { name: "Norah Jones",     songs: ["Don't Know Why", "Come Away With Me", "Sunrise"] },
    { name: "Bill Evans",      songs: ["Waltz for Debby", "Peace Piece", "My Foolish Heart"] }
  ],
  "Hip-Hop": [
    { name: "Eminem",         songs: ["Lose Yourself", "Not Afraid", "Rap God"] },
    { name: "Kendrick Lamar", songs: ["HUMBLE.", "Alright", "DNA."] },
    { name: "Epik High",      songs: ["Fly", "Love Love Love", "Don't Hate Me"] }
  ],
  "Classical": [
    { name: "Beethoven", songs: ["Symphony No.5", "Moonlight Sonata", "Für Elise"] },
    { name: "Mozart",    songs: ["Eine kleine Nachtmusik", "Turkish March", "Requiem"] },
    { name: "Chopin",    songs: ["Nocturne Op.9 No.2", "Fantaisie-Impromptu", "Ballade No.1"] }
  ]
};

/* ===== 2. 퀴즈 질문지 (각 보기는 특정 장르에 투표) ===== */
const quizQuestions = [
  {
    q: "주말 오후, 당신이 가장 듣고 싶은 분위기는?",
    options: [
      { text: "신나고 트렌디한 음악", genre: "K-Pop" },
      { text: "강렬하고 에너지 넘치는 사운드", genre: "Rock" },
      { text: "여유롭고 감미로운 선율", genre: "Jazz" },
      { text: "리듬감 있고 자유로운 랩", genre: "Hip-Hop" },
      { text: "차분하고 우아한 연주곡", genre: "Classical" }
    ]
  },
  {
    q: "음악에서 가장 중요하게 생각하는 요소는?",
    options: [
      { text: "따라 부르기 좋은 멜로디와 퍼포먼스", genre: "K-Pop" },
      { text: "기타와 드럼의 밴드 사운드", genre: "Rock" },
      { text: "즉흥적이고 세련된 연주", genre: "Jazz" },
      { text: "가사와 라임, 비트", genre: "Hip-Hop" },
      { text: "악기의 정교한 하모니", genre: "Classical" }
    ]
  },
  {
    q: "어떤 장소에서 음악을 듣고 싶나요?",
    options: [
      { text: "친구들과 함께하는 파티", genre: "K-Pop" },
      { text: "열정적인 공연장/페스티벌", genre: "Rock" },
      { text: "조용한 카페나 바", genre: "Jazz" },
      { text: "드라이브하는 도심 거리", genre: "Hip-Hop" },
      { text: "고요한 공연홀이나 서재", genre: "Classical" }
    ]
  }
];

/* ===== 3. 화면 렌더링 ===== */
let currentGenre = null;
const genreButtonsEl = document.getElementById('genreButtons');
const artistListEl   = document.getElementById('artistList');
const searchBox      = document.getElementById('searchBox');

// (1) 장르 버튼 생성
Object.keys(musicData).forEach(genre => {
  const btn = document.createElement('button');
  btn.className = 'genre-btn';
  btn.textContent = genre;
  btn.dataset.genre = genre;
  btn.onclick = () => {
    searchBox.value = '';          // 검색어 초기화
    selectGenre(genre, btn);
  };
  genreButtonsEl.appendChild(btn);
});

// (2) 장르 선택 처리
function selectGenre(genre, btnEl) {
  currentGenre = genre;
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  renderArtists(genre, musicData[genre]);
}

// (3) 아티스트 목록 렌더링 (genre별 or 검색결과 리스트)
function renderArtists(genre, artists) {
  artistListEl.innerHTML = '';
  if (!artists || artists.length === 0) {
    artistListEl.innerHTML = '<div class="empty">표시할 아티스트가 없습니다.</div>';
    return;
  }
  artists.forEach(artist => {
    artistListEl.appendChild(createArtistCard(artist, genre));
  });
}

// (4) 아티스트 카드(아코디언) 생성
function createArtistCard(artist, genre) {
  const card = document.createElement('div');
  card.className = 'artist-card';

  // 헤더 (아티스트 이름 + 장르 태그)
  const header = document.createElement('div');
  header.className = 'artist-header';
  header.innerHTML = `<span class="artist-name">${artist.name}</span>
                      <span class="artist-genre-tag">${genre} ▾</span>`;

  // 곡 목록 영역 (기본 숨김)
  const songsBox = document.createElement('div');
  songsBox.className = 'songs';

  artist.songs.forEach(song => {
    const row = document.createElement('div');
    row.className = 'song-row';

    const title = document.createElement('span');
    title.textContent = '🎶 ' + song;

    // 유튜브 버튼: 가수명 + 곡명 검색 URL을 새 탭으로 열기
    const ytBtn = document.createElement('button');
    ytBtn.className = 'yt-btn';
    ytBtn.textContent = '▶ YouTube';
    ytBtn.onclick = (e) => {
      e.stopPropagation(); // 아코디언 토글과 분리
      const query = encodeURIComponent(artist.name + ' ' + song);
      window.open('https://www.youtube.com/results?search_query=' + query, '_blank');
    };

    row.appendChild(title);
    row.appendChild(ytBtn);
    songsBox.appendChild(row);
  });

  // 헤더 클릭 시 곡 목록 펼치기/접기 (아코디언)
  header.onclick = () => songsBox.classList.toggle('open');

  card.appendChild(header);
  card.appendChild(songsBox);
  return card;
}

/* ===== 4. 검색 기능 (실시간 필터링) ===== */
searchBox.addEventListener('input', () => {
  const keyword = searchBox.value.trim().toLowerCase();

  // 검색어가 없으면: 선택된 장르 표시 or 비움
  if (keyword === '') {
    if (currentGenre) {
      renderArtists(currentGenre, musicData[currentGenre]);
    } else {
      artistListEl.innerHTML = '';
    }
    return;
  }

  // 검색 중에는 장르 버튼 선택 해제
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
  currentGenre = null;

  // 모든 장르를 순회하며 장르명 또는 가수명이 일치하는 결과 수집
  const results = []; // { genre, artist } 형태로 저장
  Object.keys(musicData).forEach(genre => {
    const genreMatch = genre.toLowerCase().includes(keyword);
    musicData[genre].forEach(artist => {
      const nameMatch = artist.name.toLowerCase().includes(keyword);
      if (genreMatch || nameMatch) {
        results.push({ genre, artist });
      }
    });
  });

  // 결과 렌더링
  artistListEl.innerHTML = '';
  if (results.length === 0) {
    artistListEl.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }
  results.forEach(item => {
    artistListEl.appendChild(createArtistCard(item.artist, item.genre));
  });
});

/* ===== 5. 퀴즈 렌더링 ===== */
const quizQuestionsEl = document.getElementById('quizQuestions');
const selectedAnswers = {}; // { 질문번호: 장르 }

quizQuestions.forEach((item, qIndex) => {
  const qDiv = document.createElement('div');
  qDiv.className = 'quiz-q';

  const qText = document.createElement('p');
  qText.textContent = `Q${qIndex + 1}. ${item.q}`;
  qDiv.appendChild(qText);

  item.options.forEach(opt => {
    const optBtn = document.createElement('button');
    optBtn.className = 'quiz-opt';
    optBtn.textContent = opt.text;
    optBtn.onclick = () => {
      // 같은 질문 내 다른 보기 선택 해제 후 현재 보기만 선택
      qDiv.querySelectorAll('.quiz-opt').forEach(b => b.classList.remove('selected'));
      optBtn.classList.add('selected');
      selectedAnswers[qIndex] = opt.genre;
    };
    qDiv.appendChild(optBtn);
  });

  quizQuestionsEl.appendChild(qDiv);
});

/* ===== 6. 퀴즈 결과 계산 & 장르 추천 ===== */
function showQuizResult() {
  const resultEl = document.getElementById('quizResult');

  // 모든 질문에 답했는지 확인
  if (Object.keys(selectedAnswers).length < quizQuestions.length) {
    resultEl.style.display = 'block';
    resultEl.innerHTML = '모든 질문에 답해주세요! 🙏';
    return;
  }

  // 장르별 점수 집계
  const scores = {};
  Object.values(selectedAnswers).forEach(genre => {
    scores[genre] = (scores[genre] || 0) + 1;
  });

  // 최고 점수 장르 찾기
  let bestGenre = null;
  let maxScore = 0;
  Object.keys(scores).forEach(genre => {
    if (scores[genre] > maxScore) {
      maxScore = scores[genre];
      bestGenre = genre;
    }
  });

  // 결과 표시
  resultEl.style.display = 'block';
  resultEl.innerHTML =
    `당신에게 어울리는 장르는<br><strong>${bestGenre}</strong><br>
     아래 버튼으로 아티스트를 확인해보세요!`;

  // 추천 장르의 아티스트 목록 자동 표시 + 해당 버튼 활성화
  const targetBtn = document.querySelector(`.genre-btn[data-genre="${bestGenre}"]`);
  selectGenre(bestGenre, targetBtn);

  // 아티스트 리스트 위치로 부드럽게 스크롤
  artistListEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
